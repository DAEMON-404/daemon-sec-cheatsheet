        - heading "Redis" [level=2] [ref=f6e1626]
        - blockquote [ref=f6e1627]:
          - paragraph [ref=f6e1628]: Redis is a database system that stores everything in RAM
        - paragraph [ref=f6e1629]:
          - text: The attacker changes Redis’s dump directory to the web server’s document root (
          - code [ref=f6e1630]: /var/www/html
          - text: ) and renames the dump file to
          - code [ref=f6e1631]: file.php
          - text: ", ensuring that when the database is saved, it generates a PHP file. They then create a Redis key ("
          - code [ref=f6e1632]: mykey
          - text: ) containing the web shell code, which enables remote command execution via HTTP GET parameters. Finally, the
          - code [ref=f6e1633]: SAVE
          - text: command forces Redis to write the current in-memory database to disk, resulting in the creation of the malicious web shell at
          - code [ref=f6e1634]: /var/www/html/file.php
          - text: .
        - figure "ps1 Copy" [ref=f6e1635]:
