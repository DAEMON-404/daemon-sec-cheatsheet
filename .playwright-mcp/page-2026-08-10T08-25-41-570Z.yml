            - strong [ref=f11e1817]: same line
            - text: "separated by a semicolon:"
            - code [ref=f11e1818]: stty raw -echo; fg
            - text: . In zsh, if you run them as separate commands, the
            - code [ref=f11e1819]: "-echo"
            - text: effect is lost before
            - code [ref=f11e1820]: fg
            - text: executes. Alternatively, switch to
            - code [ref=f11e1821]: bash
            - text: before starting your listener.
        - paragraph [ref=f11e1822]:
          - strong [ref=f11e1823]: "Step 4 — Back in the reverse shell (after fg brings it back):"
