        - 'heading "Method 1: Python + stty (The Classic — Most Reliable)" [level=3] [ref=f11e1778]'
        - paragraph [ref=f11e1779]: This is the standard method used by most pentesters. It works with any netcat-caught shell.
        - paragraph [ref=f11e1780]:
          - strong [ref=f11e1781]: "Step 1 — On the target (in your reverse shell):"
        - figure "bash Copy" [ref=f11e1782]:
