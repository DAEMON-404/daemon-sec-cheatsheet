        - paragraph [ref=f11e1792]:
          - strong [ref=f11e1793]: "Step 2 — Background the shell:"
        - paragraph [ref=f11e1794]:
          - text: Press
          - code [ref=f11e1795]: Ctrl+Z
          - text: to suspend the reverse shell and return to your local terminal.
        - paragraph [ref=f11e1796]:
          - strong [ref=f11e1797]: "Step 3 — On your local machine (attacker):"
        - figure "bash Copy" [ref=f11e1798]:
          - generic [ref=f11e1799]:
            - generic [ref=f11e1800]: bash
            - button "Copy" [ref=f11e1801] [cursor=pointer]
          - code [ref=f11e1806]:
            - generic [ref=f11e1807]: "# Note your terminal info (do this BEFORE the stty raw command)"
            - generic [ref=f11e1808]: "echo $TERM # e.g. xterm-256color"
            - generic [ref=f11e1809]: "stty -a # note rows and columns (e.g. rows 38; columns 116)"
            - generic [ref=f11e1810]: "# Set raw mode (this is the key step)"
            - generic [ref=f11e1811]: stty raw -echo; fg
        - blockquote [ref=f11e1812]:
