            - text: "[!warning] zsh Users If you’re using"
            - strong [ref=f11e1814]: zsh
            - text: (or Oh My Zsh),
            - code [ref=f11e1815]: stty raw -echo
            - text: and
            - code [ref=f11e1816]: fg
